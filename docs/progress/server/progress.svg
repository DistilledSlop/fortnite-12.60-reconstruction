<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title description">
  <title id="title">Dedicated-server reconstruction progress</title>
  <desc id="description">Twelve server capabilities grouped by match flow, gameplay, and networking. Each tile lists its strongest recorded evidence. Tile areas represent equal capability counts and do not estimate work completed.</desc>
  <rect width="1000" height="450" rx="14" fill="#101828"/>
  <g fill="#f4f7fc" font-family="system-ui, sans-serif">
    <text x="20" y="34" font-size="24" font-weight="700">Dedicated-server reconstruction</text>
    <text x="20" y="57" font-size="14" fill="#bfcbdd">One tile per capability. Labels show the strongest evidence recorded.</text>
    <text x="20" y="89" font-size="15" font-weight="700">Hosting and match flow</text>
    <rect x="20" y="97" width="236" height="92" rx="6" fill="#245d65"/>
    <text x="30" y="123" font-size="13" font-weight="700">Linux build and launch</text>
    <text x="30" y="143" font-size="12" fill="#e4ebf5">Server run</text>
    <rect x="260" y="97" width="236" height="92" rx="6" fill="#265f48"/>
    <text x="270" y="123" font-size="13" font-weight="700">Client join and island drop</text>
    <text x="270" y="143" font-size="12" fill="#e4ebf5">Local client run</text>
    <rect x="500" y="97" width="236" height="92" rx="6" fill="#5b4477"/>
    <text x="510" y="123" font-size="13" font-weight="700">Storm and elimination</text>
    <text x="510" y="143" font-size="12" fill="#e4ebf5">Partial server coverage</text>
    <rect x="740" y="97" width="236" height="92" rx="6" fill="#265f48"/>
    <text x="750" y="123" font-size="13" font-weight="700">Results and requeue</text>
    <text x="750" y="143" font-size="12" fill="#e4ebf5">Local client run</text>
    <text x="20" y="210" font-size="15" font-weight="700">Authoritative gameplay</text>
    <rect x="20" y="218" width="188" height="116" rx="6" fill="#254f7d"/>
    <text x="30" y="244" font-size="13" font-weight="700">Damage, health and shield</text>
    <text x="30" y="264" font-size="12" fill="#e4ebf5">Headless tests</text>
    <rect x="212" y="218" width="188" height="116" rx="6" fill="#254f7d"/>
    <text x="222" y="244" font-size="13" font-weight="700">Team knock and revive</text>
    <text x="222" y="264" font-size="12" fill="#e4ebf5">Headless tests</text>
    <rect x="404" y="218" width="188" height="116" rx="6" fill="#5b4477"/>
    <text x="414" y="244" font-size="13" font-weight="700">Loot and inventory</text>
    <text x="414" y="264" font-size="12" fill="#e4ebf5">Partial server coverage</text>
    <rect x="596" y="218" width="188" height="116" rx="6" fill="#654e29"/>
    <text x="606" y="244" font-size="13" font-weight="700">Weapons and building</text>
    <text x="606" y="264" font-size="12" fill="#e4ebf5">Implemented paths</text>
    <rect x="788" y="218" width="188" height="116" rx="6" fill="#414c60"/>
    <text x="798" y="244" font-size="13" font-weight="700">World actors</text>
    <text x="798" y="264" font-size="12" fill="#e4ebf5">Open validation</text>
    <text x="20" y="355" font-size="15" font-weight="700">Networking and backend</text>
    <rect x="20" y="363" width="316" height="68" rx="6" fill="#5b4477"/>
    <text x="30" y="389" font-size="13" font-weight="700">Identity, profiles and lobby</text>
    <text x="30" y="409" font-size="12" fill="#e4ebf5">Route evidence and probes</text>
    <rect x="340" y="363" width="316" height="68" rx="6" fill="#654e29"/>
    <text x="350" y="389" font-size="13" font-weight="700">Matchmaking and sessions</text>
    <text x="350" y="409" font-size="12" fill="#e4ebf5">Implemented paths</text>
    <rect x="660" y="363" width="316" height="68" rx="6" fill="#414c60"/>
    <text x="670" y="389" font-size="13" font-weight="700">Replication and stability</text>
    <text x="670" y="409" font-size="12" fill="#e4ebf5">Open validation</text>
